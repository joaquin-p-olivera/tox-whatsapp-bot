# Dependabot version updates. Security updates are a repository setting, not this file.
version: 2
updates:
  - package-ecosystem: npm  # reads package.json and package-lock.json
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Montevideo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR for all the small upgrades, one per major: a major is the one worth reading about
      minor-and-patch:
        update-types: [minor, patch]
